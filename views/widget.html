<button class="fab" id="fab" type="button" aria-haspopup="dialog" aria-controls="drawer"><span class="avatar" aria-hidden="true">CrH</span><span class="t">Pregunta a CrH-IA</span></button>
<section class="drawer" id="drawer" role="dialog" aria-label="Chat con CrH-IA" aria-modal="false">
  <div class="chat-head">
    <span class="avatar" aria-hidden="true">CrH</span>
    <div><strong>CrH-IA</strong><div class="status" id="drawerStatus"><i></i>Asistente académico</div></div>
    <span class="spacer"></span>
    <button class="btn sm ghost" type="button" id="drawerNew" title="Nueva conversación">Nueva</button>
    <button class="btn sm ghost" type="button" id="drawerClose" aria-label="Cerrar chat">✕</button>
  </div>
  <div class="msgs" id="drawerMsgs" aria-live="polite"></div>
  <form class="composer" id="drawerForm">
    <label class="sr-only" for="drawerInput">Tu pregunta</label>
    <textarea id="drawerInput" rows="1" placeholder="Pregunta sobre anatomía…"></textarea>
    <button class="btn primary" type="submit">Enviar</button>
  </form>
  <div class="chat-foot">Contenido educativo; no sustituye una valoración profesional.</div>
</section>
