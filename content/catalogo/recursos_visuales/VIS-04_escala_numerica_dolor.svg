<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<title>Escala numérica del dolor (ejemplo educativo)</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18352d">Escala numérica del dolor (ejemplo educativo)</text>

<text x="80" y="120" font-family="Arial" font-size="20" fill="#333">Seleccione el número que mejor representa la intensidad que siente.</text>
<line x1="110" y1="245" x2="790" y2="245" stroke="#557568" stroke-width="8" stroke-linecap="round"/>
<circle cx="110" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="110" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">0</text><circle cx="178" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="178" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">1</text><circle cx="246" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="246" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">2</text><circle cx="314" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="314" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">3</text><circle cx="382" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="382" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">4</text><circle cx="450" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="450" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">5</text><circle cx="518" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="518" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">6</text><circle cx="586" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="586" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">7</text><circle cx="654" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="654" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">8</text><circle cx="722" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="722" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">9</text><circle cx="790" cy="245" r="24" fill="#fff" stroke="#1a8b62" stroke-width="4"/><text x="790" y="253" font-family="Arial" font-size="20" text-anchor="middle" fill="#18352d">10</text>
<text x="110" y="315" font-family="Arial" font-size="18" fill="#333">Sin dolor</text>
<text x="790" y="315" font-family="Arial" font-size="18" text-anchor="end" fill="#333">Peor dolor imaginable</text>
<text x="450" y="390" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">Ejemplo didáctico; los anclajes y formato deben ajustarse a la escala y versión autorizadas.</text>

<text x="40" y="498" font-family="Arial,sans-serif" font-size="13" fill="#666">CrH-Anatomy · Diagrama educativo original · No sustituye protocolos oficiales</text>
</svg>